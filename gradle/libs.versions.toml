[versions]
agp = "9.3.2"
kotlin = "2.2.10"
composeBom = "2025.12.00"
junit = "4.13.2"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.10.1"
zip4j = "2.11.3"
apksig = "9.3.1"

# the embedded j2me runtime, taken from J2ME-Loader
appcompat = "1.7.0"
material = "1.12.0"
preference = "1.2.1"
constraintlayout = "2.2.1"
gson = "2.11.0"
asm = "9.8"
rxjava = "2.2.21"
rxandroid = "2.1.1"
mididriver = "1.29"
pngj = "2.2.3"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
# google's own apk signer, used on device to sign the exported midlet apks
apksig = { group = "com.android.tools.build", name = "apksig", version.ref = "apksig" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
rxjava = { group = "io.reactivex.rxjava2", name = "rxjava", version.ref = "rxjava" }
rxandroid = { group = "io.reactivex.rxjava2", name = "rxandroid", version.ref = "rxandroid" }
mididriver = { group = "com.github.billthefarmer", name = "mididriver", version.ref = "mididriver" }
pngj = { group = "com.github.nikita36078", name = "pngj", version.ref = "pngj" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
