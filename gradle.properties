# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
# aapt2 --shorten-resource-paths would rename the player template's launcher icon to something
# like res/-B.png, and the apk exporter has to find that file by name to replace it per project
android.enableResourceOptimizations=false
